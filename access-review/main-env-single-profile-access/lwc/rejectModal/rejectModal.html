<template>
    <lightning-modal-header label="Reject Request"></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-form-element slds-p-around_medium">
            <label class="slds-form-element__label" for="rejectComments">Comments</label>
            <div class="slds-form-element__control">
                <textarea
                    id="rejectComments"
                    class="slds-textarea"
                    rows="8"
                    placeholder="Enter reason for rejection..."
                    onchange={handleCommentChange}>
                </textarea>
            </div>
            <template if:true={errorMessage}>
                <p class="slds-text-color_error slds-m-top_x-small">{errorMessage}</p>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel} disabled={isLoading}></lightning-button>
        <lightning-button variant="destructive" label="Reject" onclick={handleReject} disabled={isLoading} class="slds-m-left_small"></lightning-button>
    </lightning-modal-footer>
</template>
